<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Namma War Builder</title>

    <link rel="icon" href="/src/assets/favicon.ico" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-[#090d14] text-slate-200">
    <div class="min-h-screen flex items-center justify-center p-6">
      <div
        class="w-full min-w-[1400px] rounded-2xl border border-slate-800 bg-[#111722] p-6 shadow-2xl shadow-black/30"
      >
        <div class="flex gap-3 w-full">
          <!-- left cont -->
          <div class="flex flex-col gap-3 w-[30%]">
            <!-- Logo -->
            <div class="flex justify-center">
              <img
                class="w-[280px] object-contain drop-shadow-lg"
                src="/src/assets/app_logo.png"
                alt="Namma War Builder"
              />
            </div>
            <!-- Commands -->
            <label
              for="command-input"
              class="flex flex-col gap-2 text-sm font-medium text-slate-300"
            >
              <span>Commands to Run</span>

              <input
                type="text"
                name="command-input"
                id="command-input"
                placeholder="e.g. npm run build"
                class="rounded-lg border border-slate-700 bg-[#0b1018] px-3 py-2.5 text-base text-slate-100 outline-none placeholder:text-slate-500 transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
              />

              <small class="text-xs font-normal text-slate-500">
                Type a command and press Enter
              </small>
            </label>

            <!-- Directory -->
            <label
              for="directory-input"
              class="mt-5 flex cursor-pointer flex-col gap-2 text-sm font-medium text-slate-300"
            >
              <span>Directory Path</span>

              <input
                type="text"
                name="directory-input"
                id="directory-input"
                placeholder="Select project folder"
                readonly
                class="cursor-pointer rounded-lg border border-slate-700 bg-[#0b1018] px-3 py-2.5 text-base text-slate-100 outline-none placeholder:text-slate-500 transition hover:border-slate-600 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
              />
            </label>

            <div class="mt-6 flex gap-3">
              <button
                id="btn"
                class="flex-1 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-950/30 transition hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-indigo-500 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50"
              >
                Start
              </button>

              <button
                id="reset-btn"
                class="flex-1 rounded-lg border border-slate-700 bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-300 transition hover:bg-slate-700 hover:text-white active:scale-[0.98]"
              >
                Reset
              </button>
            </div>
          </div>

          <!-- right cont -->
          <div class="flex flex-col gap-1 w-[70%]">
            <!-- Output -->
            <div
              class="mt-6 h-full overflow-hidden rounded-xl border border-slate-800 bg-[#080c12] relative"
            >
              <!-- Output header -->
              <div
                class="flex items-center justify-between border-b border-slate-800 bg-[#0d131d] px-4 py-2.5"
              >
                <div class="flex items-center gap-2">
                  <span class="h-2.5 w-2.5 rounded-full bg-red-500 action-btns"></span>
                  <span class="h-2.5 w-2.5 rounded-full bg-yellow-500 action-btns"></span>
                  <span class="h-2.5 w-2.5 rounded-full bg-green-500 action-btns"></span>

                  <span class="ml-2 text-xs font-medium text-slate-400">
                    Terminal Output
                  </span>
                </div>
              </div>

              <!-- Terminal -->
              <pre
                id="commandOutput"
                class="h-[380px] overflow-y-auto p-4 text-sm leading-6 text-slate-300"
              ></pre>

              <!-- Status -->
              <div class="mt-5 top-[-17px] right-[7px] z-3 absolute">
                <div
                  id="status"
                  class="inline-flex items-center gap-2 rounded-full border border-slate-700 bg-slate-900 px-2 text-sm font-medium text-slate-400 shadow-sm"
                >
                  <span
                    id="status-dot"
                    class="h-2 w-2 rounded-full bg-slate-500"
                  ></span>

                  <span id="status-text">Ready</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
